plugins {
    id 'com.android.application'
}

android {
    namespace 'com.craftworld3d.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.craftworld3d.game"
        minSdk 26          // Android 8.0+
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    // Intentionally NO network/analytics/ads/play-services dependencies.
    // CraftWorld 3D is 100% offline.
}
