name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0fbae-minecraft-world-game
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare named APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CraftWorld3D-debug.apk
          sha256sum artifacts/CraftWorld3D-debug.apk > artifacts/CraftWorld3D-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftWorld3D-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
