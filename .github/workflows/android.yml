name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-test.log || STATUS=$?
          printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -120 gradle-test.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          exit ${STATUS:-0}
      - name: Build installable APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CraftWorld-3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
