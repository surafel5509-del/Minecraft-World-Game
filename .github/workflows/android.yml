name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test engine & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run core engine unit tests (101 tests)
        run: |
          set -o pipefail
          if ! ./gradlew :core:test --no-daemon --stacktrace 2>&1 | tee gradle-test.log; then
            grep -E "error:|ERROR|FAILED|Caused by|Exception|^\* What went wrong|^> " gradle-test.log \
              | head -10 | while IFS= read -r l; do echo "::error::TEST | ${l}"; done
            exit 1
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log; then
            grep -E "error:|ERROR|FAILED|Caused by|Exception|^\* What went wrong|^> " gradle-build.log \
              | head -10 | while IFS= read -r l; do echo "::error::BUILD | ${l}"; done
            exit 1
          fi

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftWorld3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
